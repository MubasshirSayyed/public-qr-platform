
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101014">
  <meta name="description" content="Connect with our brand and explore our official social media pages.">
  <title>Our Brand | Official Links</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #101014;
      color: #fff;
      min-height: 100vh;
      padding: 35px 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 440px;
      text-align: center;
    }

    .logo {
      width: 105px;
      height: 105px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #d5b36b;
      margin: 10px auto 20px;
      background: #25252b;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .tagline {
      color: #b7b7c0;
      line-height: 1.6;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .section-title {
      font-size: 13px;
      color: #d5b36b;
      letter-spacing: 2px;
      margin-bottom: 15px;
    }

    .links {
      display: grid;
      gap: 13px;
    }

    .social-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 16px;
      border: 1px solid #38383f;
      border-radius: 12px;
      background: #1d1d24;
      color: white;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      transition: 0.2s;
    }

    .social-link:hover {
      background: #d5b36b;
      color: #101014;
      transform: translateY(-2px);
    }

    .contact {
      margin-top: 25px;
      padding: 17px;
      border-radius: 12px;
      background: #1d1d24;
      color: #c5c5ce;
      font-size: 14px;
      line-height: 1.8;
    }

    .footer {
      color: #777780;
      font-size: 12px;
      margin-top: 30px;
    }
  </style>
</head>

<body>
  <main class="container">

    <!-- Replace this image with your company logo -->
    <img
      class="logo"
      src="logo.png"
      alt="Company Logo"
      onerror="this.style.display='none'"
    >

    <!-- Company information -->
    <h1>YOUR BRAND NAME</h1>

    <p class="tagline">
      Welcome to our official page.
      Connect with us and explore more about our brand.
    </p>

    <p class="section-title">CONNECT WITH US</p>

    <div class="links">

      <a class="social-link"
         href="https://www.instagram.com/abc_instantmix/?utm_source=ig_web_button_share_sheet"
         target="_blank" rel="noopener noreferrer">
        📸 Instagram
      </a>

      <a class="social-link"
         href="https://www.youtube.com/@SanskarNanwani"
         target="_blank" rel="noopener noreferrer">
        ▶️ YouTube
      </a>

      <a class="social-link"
         href="https://www.facebook.com/share/1FGHz1wqwj/"
         target="_blank" rel="noopener noreferrer">
        📘 Facebook
      </a>

      <a class="social-link"
         href="https://wa.me/918788004020"
         target="_blank" rel="noopener noreferrer">
        💬 WhatsApp
      </a>

    </div>

    <div class="contact">
      <strong>Contact Us</strong><br>
      Email: abcinstantmix@gmail.com<br>
      Phone: +91 8788004020
    </div>

    <p class="footer">
      © 2026 YOUR BRAND NAME. All rights reserved.
    </p>

  </main>
</body>
</html>
